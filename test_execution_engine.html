<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMint Execution Engine Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8fafc;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }
        .header h1 {
            color: #1e293b;
            margin: 0;
            font-size: 2.5rem;
        }
        .header p {
            color: #64748b;
            font-size: 1.1rem;
            margin: 10px 0 0 0;
        }
        .input-section {
            margin-bottom: 30px;
        }
        .input-section label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
        }
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            padding: 10px 15px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #6366f1;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        .btn-primary:hover {
            background: #5855eb;
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .results {
            margin-top: 30px;
        }
        .result-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .result-section h3 {
            margin: 0 0 15px 0;
            color: #1e293b;
            font-size: 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .analysis-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }
        .analysis-item strong {
            color: #374151;
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .analysis-item span {
            color: #6b7280;
            font-size: 14px;
        }
        .output-content {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .mermaid {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 20px;
            overflow-x: auto;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .example-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .example-btn {
            padding: 6px 12px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .example-btn:hover {
            background: #e2e8f0;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .step {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            margin: 0 10px;
            background: #f1f5f9;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }
        .step.active {
            background: #6366f1;
            color: white;
        }
        .step.completed {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 MindMint Execution Engine</h1>
            <p>3-Step Process: UNDERSTAND → STRUCTURE → GENERATE</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1">1. UNDERSTAND</div>
            <div class="step" id="step2">2. STRUCTURE</div>
            <div class="step" id="step3">3. GENERATE</div>
        </div>

        <div class="input-section">
            <label for="inputText">Input Text (Source Material)</label>
            <div class="example-buttons">
                <button class="example-btn" onclick="loadExample('photosynthesis')">Photosynthesis</button>
                <button class="example-btn" onclick="loadExample('business')">Business Strategy</button>
                <button class="example-btn" onclick="loadExample('technical')">Technical Tutorial</button>
            </div>
            <textarea 
                id="inputText" 
                placeholder="Enter your source material here. The execution engine will analyze it and generate structured content based on the selected mode and layout."
            ></textarea>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Mode</label>
                <select id="mode">
                    <option value="mindmap">Mindmap</option>
                    <option value="flashcards">Flashcards</option>
                    <option value="quiz">Quiz</option>
                    <option value="summary">Summary</option>
                    <option value="infographic">Infographic</option>
                </select>
            </div>
            <div class="control-group">
                <label>Layout</label>
                <select id="layout">
                    <option value="classic">Classic</option>
                    <option value="chain">Chain</option>
                    <option value="layered">Layered</option>
                    <option value="flow">Flow</option>
                </select>
            </div>
            <button class="btn btn-primary" id="generateBtn" onclick="generateContent()">
                Generate with Execution Engine
            </button>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="result-section">
                <h3>🔍 STEP 1: UNDERSTAND (Analysis)</h3>
                <div class="analysis-grid" id="analysis"></div>
            </div>

            <div class="result-section">
                <h3>🏗️ STEP 2: STRUCTURE (Plan)</h3>
                <div id="structure"></div>
            </div>

            <div class="result-section">
                <h3>🎯 STEP 3: GENERATE (Output)</h3>
                <div id="output"></div>
            </div>
        </div>
    </div>

    <script>
        const examples = {
            photosynthesis: `Photosynthesis is a vital biological process that converts light energy into chemical energy. During photosynthesis, plants absorb carbon dioxide from the atmosphere and water from the soil. The chlorophyll in plant cells captures light energy, which powers the conversion of carbon dioxide and water into glucose and oxygen. This process occurs primarily in the chloroplasts of plant cells, specifically in structures called thylakoids. The light-dependent reactions happen in the thylakoid membranes, while the Calvin cycle, which synthesizes glucose, occurs in the stroma. Photosynthesis is essential for life on Earth as it produces oxygen and serves as the foundation for most food chains.`,
            business: `Digital transformation has become critical for modern businesses seeking competitive advantage. Companies must evaluate their current technology infrastructure and identify areas for improvement. Cloud migration offers scalability and cost reduction benefits. Employee training programs ensure smooth adoption of new systems. Customer experience improvements drive revenue growth and retention. Data analytics capabilities provide insights for strategic decision making.`,
            technical: `Version control systems help developers track changes to source code over time. Git is a distributed version control system that allows multiple developers to work on the same project simultaneously. Branches enable parallel development workflows. Merge conflicts occur when multiple developers modify the same code lines. Remote repositories facilitate collaboration between team members. Pull requests provide a framework for code review before integration.`
        };

        function loadExample(type) {
            document.getElementById('inputText').value = examples[type];
            document.getElementById('results').style.display = 'none';
            updateSteps(0);
        }

        function updateSteps(activeStep) {
            const steps = ['step1', 'step2', 'step3'];
            steps.forEach((stepId, index) => {
                const step = document.getElementById(stepId);
                step.className = 'step';
                if (index < activeStep) {
                    step.classList.add('completed');
                } else if (index === activeStep) {
                    step.classList.add('active');
                }
            });
        }

        async function generateContent() {
            const inputText = document.getElementById('inputText').value.trim();
            const mode = document.getElementById('mode').value;
            const layout = document.getElementById('layout').value;

            if (!inputText) {
                alert('Please enter some input text');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>Processing with Execution Engine...';

            try {
                // Simulate the 3-step process
                updateSteps(0);
                
                // Step 1: UNDERSTAND
                await new Promise(resolve => setTimeout(resolve, 800));
                const analysis = await performAnalysis(inputText);
                displayAnalysis(analysis);
                updateSteps(1);

                // Step 2: STRUCTURE
                await new Promise(resolve => setTimeout(resolve, 600));
                const structure = await createStructure(analysis, mode, layout);
                displayStructure(structure);
                updateSteps(2);

                // Step 3: GENERATE
                await new Promise(resolve => setTimeout(resolve, 800));
                const output = await generateOutput(inputText, structure);
                displayOutput(output, mode);
                updateSteps(3);

                document.getElementById('results').style.display = 'block';
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Generate with Execution Engine';
            }
        }

        async function performAnalysis(text) {
            // Simulate text analysis
            const words = text.toLowerCase().split(/\W+/).filter(w => w.length > 3);
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            
            return {
                domain: detectDomain(text),
                intent: detectIntent(text),
                audienceLevel: detectAudienceLevel(text),
                keyConcepts: extractKeyConcepts(words, sentences),
                structure: detectStructure(text),
                contentType: detectContentType(text, words)
            };
        }

        async function createStructure(analysis, mode, layout) {
            return {
                mode,
                layout,
                groundingRules: [
                    'Use ONLY information present in the input text',
                    'DO NOT introduce examples not explicitly mentioned',
                    'Preserve original subject matter and intent'
                ],
                constraints: getConstraints(mode, layout),
                approach: getApproach(mode, layout)
            };
        }

        async function generateOutput(text, structure) {
            // Simulate structured generation
            switch (structure.mode) {
                case 'mindmap':
                    return generateMindmap(text, structure.layout);
                case 'flashcards':
                    return generateFlashcards(text, structure.layout);
                case 'quiz':
                    return generateQuiz(text, structure.layout);
                case 'summary':
                    return generateSummary(text, structure.layout);
                case 'infographic':
                    return generateInfographic(text, structure.layout);
                default:
                    return text;
            }
        }

        function detectDomain(text) {
            const domains = {
                'science': ['process', 'reaction', 'energy', 'cells', 'biological'],
                'business': ['business', 'company', 'strategy', 'revenue', 'customer'],
                'technology': ['system', 'software', 'code', 'developer', 'version']
            };
            
            for (const [domain, keywords] of Object.entries(domains)) {
                if (keywords.some(keyword => text.toLowerCase().includes(keyword))) {
                    return domain;
                }
            }
            return 'general';
        }

        function detectIntent(text) {
            if (text.includes('how to') || text.includes('process')) return 'instructive';
            if (text.includes('explain') || text.includes('describe')) return 'explanatory';
            if (text.includes('compare') || text.includes('versus')) return 'comparative';
            return 'informational';
        }

        function detectAudienceLevel(text) {
            if (text.includes('basic') || text.includes('introduction')) return 'beginner';
            if (text.includes('advanced') || text.includes('complex')) return 'advanced';
            return 'intermediate';
        }

        function extractKeyConcepts(words, sentences) {
            const stopWords = ['this', 'that', 'with', 'have', 'will', 'from', 'they', 'been'];
            const concepts = words.filter(w => !stopWords.includes(w) && w.length > 4);
            return [...new Set(concepts)].slice(0, 6);
        }

        function detectStructure(text) {
            if (text.includes('first') && text.includes('then')) return 'procedural';
            if (text.includes('versus') || text.includes('compared')) return 'comparative';
            if (text.includes('step') || text.includes('process')) return 'linear';
            return 'descriptive';
        }

        function detectContentType(text, words) {
            if (words.includes('research') || words.includes('study')) return 'academic';
            if (words.includes('business') || words.includes('strategy')) return 'business';
            if (words.includes('technical') || words.includes('system')) return 'technical';
            return 'informational';
        }

        function getConstraints(mode, layout) {
            const base = { style: layout, maxItems: getMaxItems(mode) };
            
            switch (mode) {
                case 'mindmap':
                    return { ...base, nodeCount: getMindmapCount(layout) };
                case 'summary':
                    return { ...base, length: getSummaryLength(layout) };
                case 'flashcards':
                    return { ...base, cardCount: getFlashcardCount(layout) };
                default:
                    return base;
            }
        }

        function getApproach(mode, layout) {
            const approaches = {
                mindmap: {
                    classic: 'Hub-and-spoke with central root node',
                    chain: 'Linear sequence of connected concepts',
                    layered: 'Multi-level hierarchy with parent-child relationships',
                    flow: 'Left-to-right process flow'
                },
                summary: {
                    classic: 'Concise overview of main points',
                    bullet: 'Key takeaways as bullet points',
                    notes: 'Study-style labeled notes',
                    structured: 'Headings with organized sub-points'
                }
            };
            
            return approaches[mode]?.[layout] || 'Structured approach based on layout';
        }

        function getMaxItems(mode) {
            const counts = {
                mindmap: 10, flashcards: 12, quiz: 10, summary: 1, infographic: 6
            };
            return counts[mode] || 8;
        }

        function getMindmapCount(layout) {
            const counts = { classic: 7, chain: 6, layered: 9, flow: 6 };
            return counts[layout] || 7;
        }

        function getSummaryLength(layout) {
            const lengths = { classic: '3 sentences', bullet: '6 bullets', notes: '8 lines', structured: '4 sections' };
            return lengths[layout] || '3 sentences';
        }

        function getFlashcardCount(layout) {
            const counts = { classic: 10, qa: 8, keyword: 12, chunked: 6, scenario: 8 };
            return counts[layout] || 8;
        }

        function displayAnalysis(analysis) {
            const container = document.getElementById('analysis');
            container.innerHTML = `
                <div class="analysis-item">
                    <strong>Domain</strong>
                    <span>${analysis.domain}</span>
                </div>
                <div class="analysis-item">
                    <strong>Intent</strong>
                    <span>${analysis.intent}</span>
                </div>
                <div class="analysis-item">
                    <strong>Audience Level</strong>
                    <span>${analysis.audienceLevel}</span>
                </div>
                <div class="analysis-item">
                    <strong>Content Type</strong>
                    <span>${analysis.contentType}</span>
                </div>
                <div class="analysis-item">
                    <strong>Structure</strong>
                    <span>${analysis.structure}</span>
                </div>
                <div class="analysis-item">
                    <strong>Key Concepts</strong>
                    <span>${analysis.keyConcepts.join(', ')}</span>
                </div>
            `;
        }

        function displayStructure(structure) {
            const container = document.getElementById('structure');
            container.innerHTML = `
                <div style="background: white; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <strong>Mode:</strong> ${structure.mode} | <strong>Layout:</strong> ${structure.layout}
                </div>
                <div style="background: white; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <strong>Grounding Rules:</strong>
                    <ul style="margin: 10px 0; padding-left: 20px;">
                        ${structure.groundingRules.map(rule => `<li style="margin: 5px 0; color: #6b7280;">${rule}</li>`).join('')}
                    </ul>
                </div>
                <div style="background: white; padding: 15px; border-radius: 6px;">
                    <strong>Constraints:</strong> ${JSON.stringify(structure.constraints, null, 2)}
                    <br><br>
                    <strong>Approach:</strong> ${structure.approach}
                </div>
            `;
        }

        function displayOutput(output, mode) {
            const container = document.getElementById('output');
            
            if (mode === 'mindmap') {
                container.innerHTML = `
                    <div class="mermaid">
                        <strong>Mermaid Diagram:</strong>
                        <pre style="margin: 0; background: none; padding: 0; border: none;">${output}</pre>
                    </div>
                `;
            } else if (mode === 'summary') {
                container.innerHTML = `
                    <div class="output-content">${output}</div>
                `;
            } else if (mode === 'flashcards') {
                container.innerHTML = `
                    <div class="output-content">${JSON.stringify(output, null, 2)}</div>
                `;
            } else if (mode === 'quiz') {
                container.innerHTML = `
                    <div class="output-content">${JSON.stringify(output, null, 2)}</div>
                `;
            } else if (mode === 'infographic') {
                container.innerHTML = `
                    <div class="output-content">${JSON.stringify(output, null, 2)}</div>
                `;
            } else {
                container.innerHTML = `
                    <div class="output-content">${output}</div>
                `;
            }
        }

        function generateMindmap(text, layout) {
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            const mainTopic = sentences[0]?.trim() || 'Main Topic';
            const branches = sentences.slice(1, 6).map(s => s.trim());

            switch (layout) {
                case 'classic':
                    return `graph TD\nA["${mainTopic.slice(0, 40)}"]\n${branches.map((branch, i) => {
                        const nodeId = String.fromCharCode(66 + i);
                        return `${nodeId}["${branch.slice(0, 30)}"]\nA --> ${nodeId}`;
                    }).join('\n')}`;
                case 'chain':
                    return `graph TD\n${branches.map((branch, i) => {
                        const nodeId = String.fromCharCode(65 + i);
                        const label = i === 0 ? mainTopic : branch;
                        let result = `${nodeId}["${label.slice(0, 30)}"]\n`;
                        if (i > 0) {
                            const prevId = String.fromCharCode(64 + i);
                            result += `${prevId} --> ${nodeId}`;
                        }
                        return result;
                    }).join('\n')}`;
                case 'layered':
                    const level1 = branches.slice(0, 3);
                    const level2 = branches.slice(3, 6);
                    return `graph TD\nRoot["${mainTopic.slice(0, 30)}"]\n${level1.map((item, i) => {
                        const l1Id = `L1${String.fromCharCode(65 + i)}`;
                        const l2Item = level2[i] || `Detail ${i + 1}`;
                        const l2Id = `L2${String.fromCharCode(65 + i)}1`;
                        return `${l1Id}["${item.slice(0, 25)}"]\nRoot --> ${l1Id}\n${l2Id}["${l2Item.slice(0, 20)}"]\n${l1Id} --> ${l2Id}`;
                    }).join('\n')}`;
                default:
                    return `graph TD\nA["${mainTopic.slice(0, 40)}"]\nB["${branches[0]?.slice(0, 30) || 'Branch 1'}"]\nA --> B`;
            }
        }

        function generateFlashcards(text, layout) {
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 10);
            return sentences.slice(0, 6).map((sentence, i) => ({
                question: `What does the text say about "${sentence.trim().slice(0, 40)}..."?`,
                answer: sentence.trim(),
                tag: `${layout}-${Math.floor(i / 2) + 1}`
            }));
        }

        function generateQuiz(text, layout) {
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 15);
            return sentences.slice(0, 4).map((sentence, i) => ({
                type: i % 2 === 0 ? 'multiple-choice' : 'true-false',
                question: `Based on the text, what is mentioned about "${sentence.trim().slice(0, 50)}..."?`,
                options: i % 2 === 0 ? [
                    sentence.trim().slice(0, 40) + '...',
                    'Alternative interpretation',
                    'Different perspective',
                    'Unrelated concept'
                ] : ['True', 'False'],
                correctAnswer: i % 2 === 0 ? sentence.trim().slice(0, 40) + '...' : 'True',
                explanation: sentence.trim(),
                meta: { difficulty: 'intermediate', style: layout }
            }));
        }

        function generateSummary(text, layout) {
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            
            switch (layout) {
                case 'bullet':
                    return sentences.slice(0, 6).map(s => `• ${s.trim().split(' ').slice(0, 12).join(' ')}...`).join('\n');
                case 'notes':
                    return [
                        `Key Concept: ${sentences[0]?.trim() || 'Main topic'}`,
                        `Important Points: ${sentences.slice(1, 4).map(s => s.trim()).join('; ')}`,
                        `Summary: ${sentences[0]?.trim() || 'Central theme established'}`
                    ].join('\n');
                default:
                    return sentences.slice(0, 3).map(s => s.trim()).join('. ');
            }
        }

        function generateInfographic(text, layout) {
            const steps = text.split('\n').filter(line => line.trim()).slice(0, 5);
            return {
                title: steps[0]?.trim() || 'Generated Infographic',
                tagline: 'Structured information from input text',
                layout: layout,
                steps: steps.map((step, i) => ({
                    title: step.trim().slice(0, 30) || `Step ${i + 1}`,
                    description: `Information from input: ${step.trim().slice(0, 50)}...`,
                    icon: ['star', 'arrow', 'check', 'dot', 'bulb'][i % 5],
                    accent: ['blue', 'green', 'purple', 'orange', 'red'][i % 5]
                }))
            };
        }

        // Load a default example
        window.onload = function() {
            loadExample('photosynthesis');
        };
    </script>
</body>
</html>
